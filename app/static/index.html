<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>chat2dify</title>
    <link rel="stylesheet" href="static/styles.css?v=chat-v3.0.0">
  </head>
  <body>
    <div class="app-frame">
      <aside class="app-sidebar" aria-label="chat2dify navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">c2d</span>
          <span class="brand-name">chat2dify</span>
        </div>
        <nav class="side-nav" aria-label="Primary">
          <a class="side-nav-item side-nav-item-active" href="./" aria-current="page">
            <span class="side-nav-icon" aria-hidden="true">▣</span>
            <span>工作台</span>
          </a>
          <span class="side-nav-item side-nav-item-disabled" aria-disabled="true">
            <span class="side-nav-icon" aria-hidden="true">◇</span>
            <span>资源</span>
          </span>
          <span class="side-nav-item side-nav-item-disabled" aria-disabled="true">
            <span class="side-nav-icon" aria-hidden="true">○</span>
            <span>状态</span>
          </span>
        </nav>
      </aside>

      <main class="chat-shell" aria-labelledby="app-title">
        <header class="chat-header">
          <div class="header-title">
            <h1 id="app-title">对话工作台</h1>
            <span class="header-subtitle">chat2dify</span>
          </div>
          <div class="header-actions">
            <label class="planner-picker" for="planner-select">
              <span>Planner</span>
              <select id="planner-select" aria-label="Planner LLM">
                <option>Loading</option>
              </select>
            </label>
            <button id="refresh-health" type="button" class="secondary">刷新</button>
            <span id="health-status" class="status-pill status-muted">Checking</span>
          </div>
        </header>

        <section id="chat-log" class="chat-log" aria-live="polite"></section>

        <form id="chat-form" class="chat-composer">
          <textarea
            id="chat-input"
            rows="3"
            autocomplete="off"
            placeholder="创建一个电脑城售后服务工作流，或：运行这个工作流，输入：电脑黑屏开不了机"
            required
          ></textarea>
          <button id="chat-submit" type="submit">发送</button>
        </form>
      </main>
    </div>

    <script>
      window.CHAT2DIFY_CONFIG = {"basePath":"","version":"3.0.0"};
    </script>
    <script src="static/app.js?v=chat-v3.0.0" defer></script>
  </body>
</html>
