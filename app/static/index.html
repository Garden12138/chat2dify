<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>chat2dify</title>
    <link rel="stylesheet" href="/static/styles.css?v=chat-v2.0.2">
  </head>
  <body>
    <main class="chat-shell" aria-labelledby="app-title">
      <header class="chat-header">
        <div>
          <h1 id="app-title">chat2dify</h1>
          <p>通过一个对话框创建、修改、测试运行 Dify 应用</p>
        </div>
        <div class="header-actions">
          <button id="refresh-health" type="button" class="secondary">Refresh</button>
          <span id="health-status" class="status-pill status-muted">Checking</span>
        </div>
      </header>

      <section id="chat-log" class="chat-log" aria-live="polite"></section>

      <form id="chat-form" class="chat-composer">
        <textarea
          id="chat-input"
          rows="3"
          autocomplete="off"
          placeholder="例如：创建一个 Chatflow 售后助手，或：运行刚才那个：我要投诉订单配送太慢"
          required
        ></textarea>
        <button id="chat-submit" type="submit">Send</button>
      </form>
    </main>

    <script src="/static/app.js?v=chat-v2.0.2" defer></script>
  </body>
</html>
