[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat2dify"
version = "4.0.0"
description = "Dify panel component for creating, editing, running, and publishing apps from natural language."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_dify: destructive localhost-only Dify integration acceptance; disabled unless explicitly enabled",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
app = [
    "evals/cases/*.json",
    "evals/fixtures/**/*.json",
    "evals/reports/*.json",
    "static/*",
]
